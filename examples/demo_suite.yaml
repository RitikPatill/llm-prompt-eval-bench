name: demo suite
description: "3-case suite demoing exact_match, regex, and llm_judge across two models"

cases:
  - id: exact-hello
    input: "Reply with exactly the word: hello"
    expected: "hello"
    models:
      - openai/gpt-4o-mini
      - anthropic/claude-haiku-4-5-20251001
    scorer: exact_match

  - id: regex-year
    input: "What year did World War 2 end? Reply with only the 4-digit year."
    expected: "^\\d{4}$"
    models:
      - openai/gpt-4o-mini
      - anthropic/claude-haiku-4-5-20251001
    scorer: regex

  - id: judge-haiku
    input: "Write a haiku about debugging code."
    models:
      - openai/gpt-4o-mini
      - anthropic/claude-haiku-4-5-20251001
    scorer: llm_judge
