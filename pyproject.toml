[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-prompt-eval-bench"
version = "0.1.0"
description = "A developer-focused evaluation harness for LLM prompts"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "typer==0.12.*",
    "rich==13.*",
    "pyyaml==6.*",
    "pydantic==2.*",
    "openai==1.*",
    "anthropic==0.34.*",
    "jinja2==3.*",
]

[project.scripts]
eval = "eval_bench.cli:app"

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "ruff==0.5.*",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
