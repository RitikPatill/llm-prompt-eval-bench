[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-prompt-eval-bench"
version = "0.1.0"
description = "A developer-focused evaluation harness for LLM prompts"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "typer==0.12.5",
    "rich==13.9.4",
    "pyyaml==6.0.2",
    "pydantic==2.10.6",
    "openai==1.82.0",
    "anthropic==0.49.0",
    "jinja2==3.1.5",
]

[project.scripts]
eval = "eval_bench.cli:app"

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.23.8",
    "ruff==0.5.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"
